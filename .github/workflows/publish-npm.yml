name: Publish @lety-ai/react-widget-chat to npm

on:
  push:
    tags:
      - 'react-widget-chat@v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-npm-react-widget-chat
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify tag points to master
        if: github.ref_type == 'tag'
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "Tag must point to a commit on master"; exit 1; }

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @lety-ai/react-widget-chat typecheck

      - name: Build
        run: pnpm --filter @lety-ai/react-widget-chat build

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./packages/react-widget-chat/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#react-widget-chat@v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Skip if version already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./packages/react-widget-chat/package.json').version")
          if npm view "@lety-ai/react-widget-chat@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION is already on npm, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/react-widget-chat
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
